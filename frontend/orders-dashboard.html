<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Service</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0c0f;
  --surface: #111417;
  --surface2: #161a1f;
  --border: #1e2328;
  --border-bright: #2e3540;
  --accent: #00e5a0;
  --accent-dim: rgba(0,229,160,0.08);
  --text: #e2e8f0;
  --text-muted: #5a6678;
  --text-dim: #8896a8;
  --danger: #ff4d6d;
  --warn: #ffb547;
  --info: #38bdf8;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  display: grid;
  grid-template-columns: 340px 1fr;
  grid-template-rows: auto 1fr;
}

body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  opacity: .5;
}

/* TOPBAR */
.topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 56px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,12,15,0.95);
  backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 10;
}

.brand { display: flex; align-items: center; gap: 0.75rem; }
.brand-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.brand-name { font-family: var(--mono); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em; }
.brand-name span { color: var(--accent); }

.topbar-meta { display: flex; align-items: center; gap: 1rem; }

.chip {
  font-family: var(--mono); font-size: 0.65rem;
  padding: 0.25rem 0.6rem; border-radius: 3px;
  border: 1px solid var(--border-bright); color: var(--text-muted); letter-spacing: 0.05em;
}
.chip.get  { border-color: rgba(56,189,248,0.3); color: var(--info); }
.chip.post { border-color: rgba(0,229,160,0.3);  color: var(--accent); }

#conn-status { font-family: var(--mono); font-size: 0.65rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem; }
#conn-dot { width:6px;height:6px;border-radius:50%;background:var(--text-muted);flex-shrink:0; }
#conn-dot.ok      { background:var(--accent);box-shadow:0 0 6px var(--accent);animation:pulse 2s infinite; }
#conn-dot.err     { background:var(--danger); }
#conn-dot.loading { background:var(--warn);animation:pulse 1s infinite; }

/* SIDEBAR */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 1.5rem;
  display: flex; flex-direction: column; gap: 1.25rem;
  overflow-y: auto;
  background: var(--surface);
}

.section-label {
  font-family: var(--mono); font-size: 0.6rem;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 0.75rem;
}

.field { display: flex; flex-direction: column; gap: 0.4rem; }
.field label { font-family: var(--mono); font-size: 0.68rem; color: var(--text-dim); letter-spacing: 0.05em; }
.field input, .field textarea {
  background: var(--bg); border: 1px solid var(--border-bright); border-radius: 5px;
  color: var(--text); font-family: var(--mono); font-size: 0.78rem;
  padding: 0.55rem 0.75rem; outline: none; transition: border-color 0.15s; width: 100%;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--text-muted); }

.extra-fields { display: flex; flex-direction: column; gap: 0.5rem; }
.extra-row {
  display: grid; grid-template-columns: 1fr 1fr auto;
  gap: 0.4rem; align-items: center;
  animation: rowIn 0.15s ease;
}
.extra-row input {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-family: var(--mono); font-size: 0.72rem;
  padding: 0.4rem 0.5rem; outline: none; width: 100%; transition: border-color 0.15s;
}
.extra-row input:focus { border-color: var(--accent); }

.btn-remove {
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 4px; width: 26px; height: 26px; cursor: pointer; font-size: 0.8rem;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0;
}
.btn-remove:hover { border-color: var(--danger); color: var(--danger); }

.btn-add-field {
  background: none; border: 1px dashed var(--border-bright); color: var(--text-muted);
  border-radius: 4px; padding: 0.4rem; font-family: var(--mono); font-size: 0.68rem;
  cursor: pointer; transition: all 0.15s; width: 100%;
}
.btn-add-field:hover { border-color: var(--accent); color: var(--accent); }

.json-preview-box {
  background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
  padding: 0.75rem; font-family: var(--mono); font-size: 0.68rem;
  color: var(--text-muted); line-height: 1.6; max-height: 120px; overflow-y: auto; white-space: pre;
}

.btn-submit {
  background: var(--accent); color: #000; border: none; border-radius: 6px;
  padding: 0.7rem 1rem; font-family: var(--mono); font-size: 0.8rem; font-weight: 600;
  cursor: pointer; transition: all 0.15s; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
}
.btn-submit:hover { background: #00ffc2; filter: drop-shadow(0 0 10px var(--accent)); }
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }

/* TOAST */
.toast {
  position: fixed; bottom: 1.5rem; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface); border: 1px solid var(--border-bright); border-radius: 6px;
  padding: 0.6rem 1.25rem; font-family: var(--mono); font-size: 0.75rem; color: var(--text);
  opacity: 0; transition: all 0.25s; z-index: 200; white-space: nowrap;
}
.toast.ok  { border-color: var(--accent); color: var(--accent); }
.toast.err { border-color: var(--danger); color: var(--danger); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* MAIN */
.main { display: flex; flex-direction: column; overflow: hidden; }

.main-toolbar {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--surface);
}

.search-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border-bright); border-radius: 5px;
  color: var(--text); font-family: var(--mono); font-size: 0.78rem;
  padding: 0.5rem 0.75rem; outline: none; transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-muted); }

.btn {
  font-family: var(--mono); font-size: 0.72rem; font-weight: 500;
  padding: 0.5rem 1rem; border: 1px solid var(--border-bright); border-radius: 5px;
  cursor: pointer; transition: all 0.15s; background: transparent; color: var(--text-dim); white-space: nowrap;
  display: flex; align-items: center; gap: 0.35rem;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.active { border-color: var(--accent); color: var(--accent); }

.stats-row { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
.stat {
  flex: 1; padding: 0.75rem 1.5rem; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 0.15rem;
}
.stat:last-child { border-right: none; }
.stat-label { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }
.stat-val { font-family: var(--mono); font-size: 1.1rem; font-weight: 600; color: var(--text); }
.stat-val.accent { color: var(--accent); }

.table-wrap { flex: 1; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; }
thead { position: sticky; top: 0; z-index: 2; }
thead th {
  background: var(--surface2); font-family: var(--mono); font-size: 0.6rem;
  letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
  padding: 0.65rem 1.25rem; text-align: left; border-bottom: 1px solid var(--border);
}
tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; animation: rowIn 0.2s ease both; }
tbody tr:hover { background: var(--accent-dim); }
tbody tr:last-child { border-bottom: none; }

@keyframes rowIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }

td { padding: 0.8rem 1.25rem; font-size: 0.8rem; color: var(--text-dim); vertical-align: middle; }
.td-id { font-family: var(--mono); font-size: 0.72rem; color: var(--accent); width: 60px; }
.td-preview { font-family: var(--mono); font-size: 0.7rem; color: var(--text-muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.badge { display: inline-block; font-family: var(--mono); font-size: 0.62rem; padding: 0.18rem 0.45rem; border-radius: 3px; font-weight: 500; }
.badge-green { background:rgba(0,229,160,.1);  color:var(--accent); border:1px solid rgba(0,229,160,.2); }
.badge-blue  { background:rgba(56,189,248,.1); color:var(--info);   border:1px solid rgba(56,189,248,.2); }
.badge-red   { background:rgba(255,77,109,.1); color:var(--danger); border:1px solid rgba(255,77,109,.2); }
.badge-warn  { background:rgba(255,181,71,.1); color:var(--warn);   border:1px solid rgba(255,181,71,.2); }

.empty { text-align:center; padding:5rem 2rem; color:var(--text-muted); font-family:var(--mono); font-size:0.75rem; }
.empty-icon { font-size:2rem; margin-bottom:0.75rem; opacity:0.3; }

/* DRAWER */
.drawer-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; backdrop-filter:blur(2px); }
.drawer-overlay.open { display:block; }
.drawer {
  position:fixed; top:0; right:0; bottom:0; width:400px;
  background:var(--surface); border-left:1px solid var(--border-bright);
  z-index:101; transform:translateX(100%); transition:transform 0.22s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
.drawer.open { transform:translateX(0); }
.drawer-header { padding:1rem 1.25rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.drawer-title { font-family:var(--mono); font-size:0.75rem; color:var(--text-muted); }
.drawer-title span { color:var(--accent); }
.drawer-close { background:none; border:1px solid var(--border-bright); color:var(--text-muted); cursor:pointer; width:26px; height:26px; border-radius:4px; font-size:0.9rem; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
.drawer-close:hover { border-color:var(--accent); color:var(--accent); }
.drawer-body { flex:1; overflow-y:auto; padding:1.25rem; }
pre { font-family:var(--mono); font-size:0.72rem; line-height:1.7; color:var(--text-dim); background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:1rem; overflow-x:auto; white-space:pre; }

::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-bright); border-radius:2px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-dot"></div>
    <span class="brand-name">shopmicro / <span>order-service</span></span>
  </div>
  <div class="topbar-meta">
    <span class="chip post">POST /orders</span>
    <span class="chip get">GET /orders</span>
    <div id="conn-status">
      <div id="conn-dot"></div>
      <span id="conn-text">desconnectat</span>
    </div>
  </div>
</header>

<!-- SIDEBAR: crear comanda -->
<aside class="sidebar">
  <div>
    <div class="section-label">Nova comanda</div>
    <div style="display:flex;flex-direction:column;gap:0.75rem;">
      <div class="field">
        <label>product_id</label>
        <input type="text" id="f-product" placeholder="ex: 42">
      </div>
      <div class="field">
        <label>quantity</label>
        <input type="number" id="f-quantity" placeholder="ex: 3" min="1">
      </div>
      <div class="field">
        <label>user_id</label>
        <input type="text" id="f-user" placeholder="ex: 7">
      </div>
    </div>
  </div>

  <div>
    <div class="section-label">Camps addicionals</div>
    <div class="extra-fields" id="extra-fields"></div>
    <button class="btn-add-field" onclick="addExtraField()" style="margin-top:0.5rem">+ afegir camp</button>
  </div>

  <div>
    <div class="section-label">Preview JSON</div>
    <div class="json-preview-box" id="json-preview">{}</div>
  </div>

  <button class="btn-submit" id="btn-submit" onclick="createOrder()">
    <span>↑</span> Crear comanda
  </button>
</aside>

<!-- MAIN: llista comandes -->
<main class="main">
  <div class="main-toolbar">
    <input class="search-input" type="text" placeholder="Filtrar comandes..." id="search-input" oninput="renderTable()">
    <button class="btn" onclick="loadOrders()">↻ Recarregar</button>
    <button class="btn" id="auto-btn" onclick="toggleAuto()">⏱ Auto</button>
  </div>

  <div class="stats-row">
    <div class="stat">
      <span class="stat-label">Total</span>
      <span class="stat-val accent" id="s-total">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Darrera actualització</span>
      <span class="stat-val" id="s-time" style="font-size:0.75rem">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">Endpoint</span>
      <span class="stat-val" id="s-url" style="font-size:0.65rem;color:var(--text-muted)">/api/orders</span>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>product_id</th>
          <th>user_id</th>
          <th>qty</th>
          <th>Contingut</th>
          <th>Estat</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="6"><div class="empty"><div class="empty-icon">📦</div>Fes clic a "Recarregar"</div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Drawer detall -->
<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">Comanda <span id="d-id">#—</span></span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body"><pre id="d-content"></pre></div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = '/api/orders';
let allOrders = [];
let autoTimer = null;

function buildOrder() {
  const o = {};
  const pid = document.getElementById('f-product').value.trim();
  const qty = document.getElementById('f-quantity').value.trim();
  const uid = document.getElementById('f-user').value.trim();
  if (pid) o.product_id = isNaN(pid) ? pid : Number(pid);
  if (qty) o.quantity   = Number(qty);
  if (uid) o.user_id    = isNaN(uid) ? uid : Number(uid);
  document.querySelectorAll('.extra-row').forEach(row => {
    const k = row.querySelector('.ek').value.trim();
    const v = row.querySelector('.ev').value.trim();
    if (k) o[k] = (v !== '' && !isNaN(v)) ? Number(v) : v;
  });
  return o;
}

function updatePreview() {
  document.getElementById('json-preview').textContent = JSON.stringify(buildOrder(), null, 2);
}

document.querySelector('.sidebar').addEventListener('input', updatePreview);

function addExtraField(k='', v='') {
  const row = document.createElement('div');
  row.className = 'extra-row';
  row.innerHTML = `
    <input class="ek" type="text" placeholder="clau" value="${escHtml(k)}">
    <input class="ev" type="text" placeholder="valor" value="${escHtml(v)}">
    <button class="btn-remove" onclick="this.closest('.extra-row').remove();updatePreview()">✕</button>`;
  document.getElementById('extra-fields').appendChild(row);
  row.querySelectorAll('input').forEach(i => i.addEventListener('input', updatePreview));
  updatePreview();
}

async function createOrder() {
  const order = buildOrder();
  if (!Object.keys(order).length) { showToast('Afegeix algun camp primer', 'err'); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'Enviant...';

  try {
    const res = await fetch(`${BASE}/orders`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    showToast(`✓ Comanda #${data.order?.id} creada`, 'ok');
    ['f-product','f-quantity','f-user'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('extra-fields').innerHTML = '';
    updatePreview();
    loadOrders();
  } catch(e) {
    showToast(`Error: ${e.message}`, 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span>↑</span> Crear comanda';
  }
}

async function loadOrders() {
  setConn('loading', 'carregant...');
  try {
    const res = await fetch(`${BASE}/orders`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allOrders = Array.isArray(data) ? data : (data.orders ?? []);
    renderTable();
    document.getElementById('s-total').textContent = allOrders.length;
    document.getElementById('s-time').textContent  = new Date().toLocaleTimeString('ca-ES');
    setConn('ok', `${allOrders.length} comanda(es)`);
  } catch(e) {
    setConn('err', e.message);
    renderEmpty(`Error: ${e.message}`);
  }
}

function renderTable() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = q ? allOrders.filter(o => JSON.stringify(o).toLowerCase().includes(q)) : allOrders;

  if (!filtered.length) { renderEmpty(q ? 'Cap comanda coincideix.' : 'No hi ha comandes.'); return; }

  document.getElementById('tbody').innerHTML = filtered.map((o, i) => {
    const id   = o.id ?? (i+1);
    const pid  = o.product_id ?? '—';
    const uid  = o.user_id    ?? '—';
    const qty  = o.quantity   ?? '—';
    const prev = JSON.stringify(o);
    const preview = prev.length > 60 ? prev.slice(0,60) + '…' : prev;
    const st   = o.status ?? o.estat ?? null;
    return `<tr onclick="openDrawer(${i})" style="animation-delay:${i*20}ms">
      <td class="td-id">#${id}</td>
      <td style="font-family:var(--mono);font-size:.75rem">${escHtml(String(pid))}</td>
      <td style="font-family:var(--mono);font-size:.75rem">${escHtml(String(uid))}</td>
      <td style="font-family:var(--mono);font-size:.75rem">${escHtml(String(qty))}</td>
      <td><span class="td-preview">${escHtml(preview)}</span></td>
      <td>${st ? statusBadge(st) : '<span style="color:var(--text-muted);font-size:.7rem">—</span>'}</td>
    </tr>`;
  }).join('');
}

function renderEmpty(msg) {
  document.getElementById('tbody').innerHTML =
    `<tr><td colspan="6"><div class="empty"><div class="empty-icon">📦</div>${escHtml(msg)}</div></td></tr>`;
}

function statusBadge(v) {
  const s = String(v).toLowerCase();
  if (s.includes('creat')||s.includes('ok')||s.includes('complet')) return `<span class="badge badge-green">${escHtml(v)}</span>`;
  if (s.includes('pend')||s.includes('espera')) return `<span class="badge badge-warn">${escHtml(v)}</span>`;
  if (s.includes('err')||s.includes('cancel')) return `<span class="badge badge-red">${escHtml(v)}</span>`;
  return `<span class="badge badge-blue">${escHtml(v)}</span>`;
}

function openDrawer(idx) {
  const o = allOrders[idx];
  document.getElementById('d-id').textContent = '#' + (o.id ?? idx+1);
  document.getElementById('d-content').textContent = JSON.stringify(o, null, 2);
  document.getElementById('drawer').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function toggleAuto() {
  const btn = document.getElementById('auto-btn');
  if (autoTimer) {
    clearInterval(autoTimer); autoTimer = null;
    btn.textContent = '⏱ Auto'; btn.classList.remove('active');
  } else {
    loadOrders();
    autoTimer = setInterval(loadOrders, 5000);
    btn.textContent = '⏹ Aturar'; btn.classList.add('active');
  }
}

function setConn(state, msg) {
  document.getElementById('conn-dot').className = state;
  document.getElementById('conn-text').textContent = msg;
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

updatePreview();
loadOrders();
</script>
</body>
</html>
