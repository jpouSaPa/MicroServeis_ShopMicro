# ~/shopmicro/k8s/redis.yml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: shopmicro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  selector:
    app: cache
  ports:
  - port: 6379 
