events {
  worker_connections 1024;
}

http {
  resolver kube-dns.kube-system.svc.cluster.local valid=10s;

  server {
    listen 80;

    location /api/products/ {
      proxy_pass http://product-service:5000/;  # ← / afegida
    }

    location /api/orders/ {
      proxy_pass http://order-service:5001/;    # ← / afegida
    }

    location /api/users/ {
      proxy_pass http://user-service:5002/;     # ← / afegida
    }

    location /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
