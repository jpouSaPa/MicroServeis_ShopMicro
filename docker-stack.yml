# ~/shopmicro/docker-stack.yml
version: '3.8'

networks:
  frontend-net:
    driver: overlay
  backend-net:
    driver: overlay
  db-net:
    driver: overlay

volumes:
  db_products_data:
  db_orders_data:
  db_users_data:
  rabbitmq_data:

services:

  # ─── BASES DE DADES ─────────────────────────────────
  db-products:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: productsdb
    volumes:
      - db_products_data:/var/lib/mysql
    networks: [db-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # BD sempre al manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-orders:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ordersdb
    volumes:
      - db_orders_data:/var/lib/mysql
    networks: [db-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # BD sempre al manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-users:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: usersdb
    volumes:
      - db_users_data:/var/lib/mysql
    networks: [db-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # BD sempre al manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── CACHE ──────────────────────────────────────────
  cache:
    image: redis:7-alpine
    networks: [backend-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── CUA DE MISSATGES ───────────────────────────────
  message-queue:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpass
    ports:
      - "15672:15672"
    networks: [backend-net]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── MICROSERVEIS ────────────────────────────────────
  product-service:
    image: jpou/shopmicro-product-service:latest
    environment:
      REDIS_HOST: cache
      DB_HOST: db-products
      DATABASE_URL: mysql+pymysql://root:rootpass@db-products:3306/productsdb
    networks: [backend-net, db-net]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s

  order-service:
    image: jpou/shopmicro-order-service:latest
    environment:
      RABBITMQ_HOST: message-queue
      DB_HOST: db-orders
      DATABASE_URL: mysql+pymysql://root:rootpass@db-orders:3306/ordersdb
    networks: [backend-net, db-net]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s

  user-service:
    image: jpou/shopmicro-user-service:latest
    environment:
      DB_HOST: db-users
      DATABASE_URL: mysql+pymysql://root:rootpass@db-users:3306/usersdb
      SECRET_KEY: "x7FjQ9m2R4pS8uV3w0LbA1fT9ZkH5cN2yPqR6sM8nE0bV4tG7hJ1kL9dF6X3C2Z"
    networks: [backend-net, db-net]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s

  notification-service:
    image: jpou/shopmicro-notification-service:latest
    environment:
      RABBITMQ_HOST: message-queue
    networks: [backend-net]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s

  # ─── API GATEWAY ─────────────────────────────────────
  api-gateway:
    image: jpou/shopmicro-api-gateway:latest
    ports:
      - "8080:80"
    networks: [frontend-net, backend-net]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s

  # ─── FRONTEND ─────────────────────────────────────────
  frontend:
    image: jpou/shopmicro-frontend:latest
    ports:
      - "80:80"
    networks: [frontend-net]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
