# ~/shopmicro/docker-stack.yml
version: '3.8'

networks:
  frontend-net:
    driver: overlay
  backend-net:
    driver: overlay
  db-net:
    driver: overlay

volumes:
  db_products_data:
  db_orders_data:
  db_users_data:
  rabbitmq_data:

services:

  # ─── BASES DE DADES ─────────────────────────────────
  db-products:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password_products
      MYSQL_DATABASE: productsdb
    secrets:
      - db_root_password_products
    volumes:
      - db_products_data:/var/lib/mysql
    networks: [db-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # BD sempre al manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-orders:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password_orders
      MYSQL_DATABASE: ordersdb
    secrets:
      - db_root_password_orders
    volumes:
      - db_orders_data:/var/lib/mysql
    networks: [db-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # BD sempre al manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-users:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password_users
      MYSQL_DATABASE: usersdb
    secrets:
      - db_root_password_users
    volumes:
      - db_users_data:/var/lib/mysql
    networks: [db-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]   # BD sempre al manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── CACHE ──────────────────────────────────────────
  cache:
    image: redis:7-alpine
    networks: [backend-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── CUA DE MISSATGES ───────────────────────────────
  message-queue:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpass
    ports:
      - "15672:15672"
    networks: [backend-net]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── MICROSERVEIS ────────────────────────────────────
  product-service:
    image: jpou/shopmicro-product-service:latest
    environment:
      REDIS_HOST: cache
      DB_HOST: db-products
      DB_NAME: productsdb
      DB_PASSWORD_FILE: /run/secrets/db_root_password_products
    secrets:
      - db_root_password_products
    networks: [backend-net, db-net]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s

  order-service:
    image: jpou/shopmicro-order-service:latest
    environment:
      RABBITMQ_HOST: message-queue
      DB_HOST: db-orders
      DB_NAME: ordersdb
      DB_PASSWORD_FILE: /run/secrets/db_root_password_orders
    networks: [backend-net, db-net]
    secrets:
      - db_root_password_orders
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s

  user-service:
    image: jpou/shopmicro-user-service:latest
    environment:
      DB_HOST: db-users
      DB_NAME: usersdb
      DB_PASSWORD_FILE: /run/secrets/db_root_password_users
      SECRET_KEY_FILE: /run/secrets/userservice_secret_key
    secrets:
      - db_root_password_users
      - userservice_secret_key
    networks: [backend-net, db-net]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s

  notification-service:
    image: jpou/shopmicro-notification-service:latest
    environment:
      RABBITMQ_HOST: message-queue
    networks: [backend-net]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s

  # ─── API GATEWAY ─────────────────────────────────────
  api-gateway:
    image: jpou/shopmicro-api-gateway:latest
    ports:
      - "8080:80"
    networks:
      frontend-net:
      backend-net:
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s

  # ─── FRONTEND ─────────────────────────────────────────
  frontend:
    image: jpou/shopmicro-frontend:latest
    ports:
      - "80:80"
    networks: [frontend-net]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s

secrets:
  db_root_password_products:
    external: true
  db_root_password_users:
    external: true
  db_root_password_orders:
    external: true
  rabbitmq_password:
    external: true
  userservice_secret_key:
    external: true

